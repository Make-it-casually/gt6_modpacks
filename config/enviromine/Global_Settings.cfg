"Kotmatross Fork Changes: Gases" {
    # If true, then all gases will be invisible [default: false]
    B:000_HardcoreGases=false

    # A number that is subtracted from the current enviromine mask filter durability if the player is in a gas block, that is suffocating [range: 0 ~ 65536, default: 10]
    I:001_GasMaskBreakMultiplier=10

    # Don't use unless you are a developer [default: false]
    B:002_SulfurDioxideGasDebugLogger=false

    # Don't use unless you are a developer [default: false]
    B:003_CarbonMonoxideGasDebugLogger=false

    # Don't use unless you are a developer [default: false]
    B:004_HydrogenSulfideGasDebugLogger=false

    # How dense the Sulfur Dioxide gas should be, in order for it to have the opportunity to poison you? [range: 1 ~ 65536, default: 5]
    I:005_SulfurDioxidePoisoningAmplifier=5

    # How dense the Sulfur Dioxide gas should be, in order for it to have the opportunity to severe poison you? [range: 1 ~ 65536, default: 10]
    I:006_SulfurDioxideSeverePoisoningAmplifier=10

    # How long does Sulfur Dioxide poisoning last? [range: 1 ~ 65536, default: 200]
    I:"007_Sulfur Dioxide Poisoning Time"=200

    # How long does severe Sulfur Dioxide poisoning last? [range: 1 ~ 65536, default: 600]
    I:008_SulfurDioxideSeverePoisoningTime=600

    # What level of poisoning applies when player is Sulfur Dioxide poisoned? [range: 0 ~ 65536, default: 0]
    I:009_SulfurDioxidePoisoningLevel=0

    # What level of poisoning applies when player is severe Sulfur Dioxide poisoned? [range: 0 ~ 65536, default: 1]
    I:010_SulfurDioxideSeverePoisoningLevel=1

    # What is the chance of Sulfur Dioxide poisoning if the player has no protection? [range: 1 ~ 65536, default: 5]
    I:"011_Sulfur DioxidePoisoningChance"=5

    # How dense the Carbon Monoxide gas should be, in order for it to have the opportunity to poison you? [range: 1 ~ 65536, default: 5]
    I:012_CarbonMonoxidePoisoningAmplifier=5

    # How long does Carbon Monoxide poisoning last? [range: 1 ~ 65536, default: 200]
    I:013_CarbonMonoxidePoisoningTime=200

    # What level of poisoning applies when player is Carbon Monoxide poisoned? [range: 0 ~ 65536, default: 0]
    I:014_CarbonMonoxidePoisoningLevel=0

    # What is the chance of Carbon Monoxide poisoning if the player has no protection? [range: 1 ~ 65536, default: 5]
    I:015_CarbonMonoxidePoisoningChance=5

    # How dense the Hydrogen Sulfide gas should be, in order for it to have the opportunity to poison you? [range: 1 ~ 65536, default: 5]
    I:016_HydrogenSulfidePoisoningAmplifier=5

    # How dense the Hydrogen Sulfide gas should be, in order for it to have the opportunity to severe poison you? [range: 1 ~ 65536, default: 10]
    I:017_HydrogenSulfideSeverePoisoningAmplifier=10

    # How long does Hydrogen Sulfide poisoning last? [range: 1 ~ 65536, default: 200]
    I:"018_HydrogenSulfidePoisoning Time"=200

    # How long does severe Hydrogen Sulfide poisoning last? [range: 1 ~ 65536, default: 600]
    I:019_HydrogenSulfideSeverePoisoningTime=600

    # What level of poisoning applies when player is Hydrogen Sulfide poisoned? [range: 0 ~ 65536, default: 0]
    I:"020_Hydrogen Sulfide Poisoning Level"=0

    # What level of poisoning applies when player is severe Hydrogen Sulfide poisoned? [range: 0 ~ 65536, default: 1]
    I:"021_Hydrogen Sulfide Severe Poisoning Level"=1

    # What is the chance of Hydrogen Sulfide poisoning if the player has no protection? [range: 1 ~ 65536, default: 5]
