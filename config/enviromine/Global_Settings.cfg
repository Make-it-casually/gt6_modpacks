    # Conversion check probability denominator (1/N). For example, 5 means check every 5 updates. Higher values result in slower conversion [range: 1 ~ 100, default: 5]
    I:003_conversionChance=5

    # Whether to enable chain reaction (when a water block converts, it will attempt to convert adjacent custom water blocks) [default: true]
    B:004_chainReaction=true

    # Maximum number of custom water block conversions per tick (prevents performance issues) [range: 1 ~ 100, default: 10]
    I:005_maxConversionsPerTick=10

    # Should rotting take into account the exact time, or just the day?  [+] If false, all food obtained during the day will have different rot rates. [-] However, food cannot be stacked together, even if there is a 1 tick gap in time. [+] If true, food obtained during the same day can be stacked together. [-] However, food obtained at the beginning of the day and at the end will have the same rot rate. [default: true]
    B:006_rotTimeValidation=true

    # If true, then if a player has the insanity effect, his model is replaced with a random mob. Causes bugs with the model [default: false]
    B:007_PlayerInsanityRandomMobRender=false

