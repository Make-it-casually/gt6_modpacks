[diagnostics]
	#Allow GradleMC to write local diagnostic reports.
	reportsEnabled = true
	#Report directory name under the Minecraft game directory's gradlemc output root.
	reportDirectoryName = "reports"
	#Maximum recent report files shown in chat.
	# Default: 10
	# Range: 1 ~ 50
	maxReportFilesListed = 10
	#Default radius for nearby entity scans.
	# Default: 64
	# Range: 8 ~ 256
	defaultEntityScanRadius = 64
	#Default radius for nearby block entity scans.
	# Default: 64
	# Range: 8 ~ 256
	defaultBlockEntityScanRadius = 64
	#Maximum accepted radius for bounded scan commands.
	# Default: 256
	# Range: 32 ~ 512
	maxScanRadius = 256
	#Default duration for future bounded performance sampling.
	# Default: 60
	# Range: 5 ~ 600
	defaultPerfSeconds = 60
	#Maximum accepted duration for performance commands.
	# Default: 600
	# Range: 30 ~ 1800
	maxPerfSeconds = 600
	#Default duration for lightweight worldgen/chunk observation.
	# Default: 120
	# Range: 10 ~ 900
	defaultWorldgenObservationSeconds = 120
	#Maximum accepted duration for lightweight worldgen/chunk observation.
	# Default: 900
	# Range: 30 ~ 1800
	maxWorldgenObservationSeconds = 900
	#Default duration for client-only FPS tests.
	# Default: 60
	# Range: 5 ~ 600
	defaultFpsTestSeconds = 60
	#Maximum accepted duration for client-only FPS tests.
	# Default: 600
	# Range: 30 ~ 1800
	maxFpsTestSeconds = 600
	#Allow GradleMC to create safe issue bundle ZIP files.
	issueBundleEnabled = true
	#Include a redacted latest.log tail snippet in issue bundles. Full logs are never included.
	includeLogSnippetInIssueBundle = false
	#Maximum latest.log tail lines included when log snippets are enabled.
	# Default: 200
	# Range: 1 ~ 1000
	logSnippetLineLimit = 200
	#Run local GradleMC risk rules as part of quick checks and exports.
	enableRuleChecks = true
	#Risk rule file name inside the Minecraft game directory's gradlemc/rules folder.
	rulesFileName = "gradlemc-rules.json"
	#Show slightly more diagnostic detail in chat. Reports still contain the longer output.
	verboseChatOutput = false
	#Enable local smart diagnostics. This is rule-based/adaptive only; no cloud AI, LLMs, or telemetry.
	smartDiagnosticsEnabled = true
	#Allow GradleMC to store small local aggregate baseline metrics under the Minecraft game directory's gradlemc folder.
	adaptiveBaselineEnabled = true
	#Minimum samples before adaptive baseline comparisons are treated as stronger evidence.
	# Default: 3
	# Range: 1 ~ 20
	minBaselineSamples = 3
	#Maximum weighted sample count retained per aggregate baseline metric.
	# Default: 20
	# Range: 5 ~ 100
	maxBaselineSamplesStored = 20
	#Maximum smart recommendations shown in chat.
	# Default: 5
	# Range: 1 ~ 10
	smartAdviceMaxItems = 5
	#Anomaly sensitivity. Allowed values: LOW, NORMAL, HIGH.
	anomalySensitivity = "NORMAL"
	#Use local adaptive baseline thresholds when enough samples exist.
	smartScoreUsesAdaptiveThresholds = true

[adaptiveSmartAI]
	#Enable lightweight local adaptive diagnostics. No LLMs, cloud APIs, telemetry, or external AI services are used.
	enableAdaptiveSmartAI = true
	#Allow adaptive diagnostics to queue occasional low-impact ambience messages/effects.
	enableAdaptiveAmbience = true
	#Allow adaptive diagnostics to queue occasional bounded player-facing adaptive events.
	enableAdaptiveEvents = true
	#Calm baseline adaptive risk before local behavior and danger signals are applied.
	# Default: 8
	# Range: 0 ~ 50
	baseThreatGain = 8
	#Maximum adaptive player pressure/risk score.
	# Default: 100
	# Range: 25 ~ 100
	maxThreatLevel = 100
	#Reserved decay tuning value for future persisted adaptive data. Runtime signals currently decay in bounded steps.
	# Default: 2
	# Range: 0 ~ 20
	threatDecayRate = 2
	#Base cooldown between adaptive events for a player, in ticks.
	# Default: 2400
	# Range: 200 ~ 24000
	eventCooldownTicks = 2400
	#Base cooldown between adaptive ambience responses for a player, in ticks.
	# Default: 1200
	# Range: 100 ~ 12000
	ambienceCooldownTicks = 1200
	#Log sampled adaptive diagnostics state transitions. Keep false unless debugging.
	debugSmartAILogging = false
	#Allow HIGH/EXTREME adaptive event responses. When false, only low/medium responses can trigger.
	allowHighIntensityEvents = false
	#Reduce adaptive intensity after a player death to avoid repeated pressure.
	reduceIntensityAfterDeath = true
	#Multiplier applied to base adaptive risk contribution.
	# Default: 1.0
	# Range: 0.1 ~ 5.0
	adaptiveDifficultyMultiplier = 1.0
	#Minimum interval for the GradleMC GUI to request fresh adaptive diagnostics status while open, in ticks.
	# Default: 100
	# Range: 20 ~ 1200
	guiStatusRefreshTicks = 100

[overlay]
	#Show the optional GradleMC in-game stats overlay. Disabled by default.
	overlayEnabled = false
	#Overlay mode. Allowed values: COMPACT, DETAILED.
	overlayMode = "COMPACT"
	#Overlay position. Allowed values: TOP_LEFT, TOP_RIGHT, BOTTOM_LEFT, BOTTOM_RIGHT.
	overlayPosition = "TOP_LEFT"
	#Overlay text scale.
	# Default: 1.0
	# Range: 0.75 ~ 2.0
	overlayScale = 1.0
	#Draw a semi-transparent overlay background.
	overlayBackgroundEnabled = true
	#Overlay background opacity from 0.0 to 1.0.
	# Default: 0.55
	# Range: 0.0 ~ 1.0
	overlayBackgroundOpacity = 0.55
	#Rolling FPS statistics window in seconds. Allowed values: 30, 60, 120.
	overlaySamplingWindowSeconds = 60
	#Overlay display refresh interval in milliseconds. Allowed values: 250, 500, 1000.
	overlayUpdateIntervalMs = 500
	#Show current and average FPS.
	overlayShowFps = true
	#Show 1% low FPS after the rolling window has enough samples.
	overlayShowOnePercentLow = true
	#Show 0.1% low FPS after the rolling window has enough samples.
	overlayShowPointOnePercentLow = true
	#Show JVM heap memory usage.
	overlayShowJvmMemory = true
	#Show system memory when Java exposes it safely.
	overlayShowSystemMemory = false
	#Show process CPU usage and CPU name when Java exposes them safely.
	overlayShowCpu = false
	#Show OpenGL GPU renderer/vendor metadata on the client.
	overlayShowGpuName = true
	#Reserved for accurate GPU usage providers. GradleMC does not fake GPU usage.
	overlayShowGpuUsage = false
