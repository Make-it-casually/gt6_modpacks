[display]
	#If true, use the classic 'Redstone Flux' (RF) names instead of 'Forge Energy' (FE).
	#Default is false (FE), matching the modern Forge/NeoForge convention.
	useRfNaming = false
	#If true, spell units in full ('Minecraft Joules', 'Forge Energy', 'Redstone Flux',
	#'millibuckets') AND spell out time suffixes (' per second' / ' per tick') instead of
	#the abbreviated 'MJ'/'FE'/'RF'/'mB' units and '/s'/'/t' suffixes. Also applies to fluid
	#pipe tooltips. Default is true (full names + spelled-out time suffix, matching 1.12.2);
	#set false to get the compact 'MJ/s'/'FE/t'/'mB/t' form back.
	useFullUnitNames = true
	#Thousands grouping for large numbers in machine readouts and JEI labels.
	#COMMA: 1,000   DOT: 1.000   SPACE: 1 000   NONE: 1000.
	#Allowed Values: COMMA, DOT, SPACE, NONE
	thousandsSeparator = "COMMA"
	#Separator before the decimal portion of fractional readouts (e.g. MJ values, heat).
	#DOT: 1.5   COMMA: 1,5.
	#Allowed Values: DOT, COMMA
	decimalSeparator = "DOT"
	#If true, large energy and fluid numbers collapse to a compact form.
	abbreviateLargeNumbers = true
	#How flow rates render in machine readouts (engine ledgers, conversion-help bodies,
	#kinesis-pipe hovers, the silicon laser ledger).
	#PER_SECOND: 100.00 MJ/s   (default, matches 1.12.2's display convention)
	#PER_TICK:   5.00 MJ/t    (same figure as the underlying API gives)
	#BOTH:       100.00 MJ/s (5.00 MJ/t)
	#Allowed Values: PER_SECOND, PER_TICK, BOTH
	flowDisplay = "PER_SECOND"
	#Whether BuildCraft swaps to colourblind-friendly texture variants where available
	#(textures that use the sorting colors, like the diamond pipes).
	#AUTO: follow Minecraft's Options → Accessibility → High Contrast toggle (default).
	#OFF:  force off regardless of MC's accessibility setting.
	#ON:   force on regardless of MC's accessibility setting.
	#Allowed Values: AUTO, OFF, ON
	colorBlindMode = "AUTO"
