# Configuration file

advanced {
    # Maximum recursion depth for recipe-based aspect derivation. Higher values may increase load time. [range: 4 ~ 64, default: 10]
    I:maxRecipeDepth=10

    # Maximum passes for the recipe-first pipeline. Higher values help long chains like A=B, A+B=C, but increase scan time. [range: 1 ~ 32, default: 6]
    I:recipeFirstMaxRounds=6
}


balance {
    # When a derived item ends up with only ONE aspect type, enrich it with keyword fallback aspects. Keeps existing aspect types and only adds new ones from fallback. [default: true]
    B:enrichSingleAspect=true

    # Global decay factor for derived aspects. 0.1 = 90% decay (keep 10%), 1.0 = no decay. Each derivation layer multiplies aspect amounts by this value, with a per-aspect minimum of 1. [range: 0.05 ~ 1.0, default: 0.1]
    S:recipeDecay=0.1
}


performance {
    # 0=full scan log, 1=summary only (faster), 2=off (fastest). Reduces disk I/O during load. [range: 0 ~ 2, default: 0]
    I:scanLogLevel=2

    # Skip AbyssalCraft API/RitualRegistry diagnostic dumps (faster load, disable when debugging). [default: false]
    B:skipDiagnosticDumps=false
}


