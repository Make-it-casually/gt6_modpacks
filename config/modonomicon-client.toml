#Quality of Life Settings
[qol]
	#Enable smooth zoom in book categories
	enableSmoothZoom = true
	#Enable keeping the last open page stored when closing an entry. Regardless of this setting it will be stored when closing the entire book with Esc.
	storeLastOpenPageWhenClosingEntry = false
	#Show toast notifications when research facts are granted, values are incremented, or nodes are unlocked.
	showResearchToasts = true
	#If your locale is not supported by the default Modonomicon font, indicated by the book just rendering blocky shapes instead of characters, add your locale to this list to fall back to the builtin Minecraft font.
	fontFallbackLocales = ["zh_cn", "ja_jp", "ko_kr"]
	#If true, the game will pause when a Modonomicon book is open (singleplayer only).
	pauseGameWhenOpen = true
	#Show the recipe viewer hints in item tooltips (click to show recipe, shift-click to show usage).
	showRecipeLookupHints = false
	#How long (in milliseconds) the open key must be held while hovering an associated item before the linked book entry/page opens.
	# Default: 750
	# Range: 0 ~ 10000
	associatedItemsHoldDurationMs = 750

#Debug Settings
[debug]
	#Enable the book debug overlay. While a book is open, press F6 to toggle it. It draws color coded outlines of the page, its content area and its text area, to help with layout offsets.
	debugOverlay = false
